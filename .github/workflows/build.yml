name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Генерируем актуальную Android-обвязку (gradle, manifest) под текущую версию Flutter
      - name: Создать Android-scaffold
        run: |
          flutter create --platform=android --org com.youpage --project-name youpage /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="youpage"#android:label="YouPage"#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Сборка release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: youpage-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Опубликовать в Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YouPage сборка ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
